<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>اختر الخورس</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    :root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-glow:rgba(201,168,76,0.28);--gold-subtle:rgba(201,168,76,0.08);--gold-border:rgba(201,168,76,0.22);--gold-border-strong:rgba(201,168,76,0.5);--radius-lg:20px;--transition:0.28s cubic-bezier(.4,0,.2,1);}
    [data-theme="dark"]{--bg-page:#070C16;--bg-card:rgba(255,255,255,0.04);--bg-card-hover:rgba(201,168,76,0.07);--bg-nav:rgba(7,12,22,0.82);--text-primary:#F0EAD6;--text-secondary:rgba(240,234,214,0.62);--text-muted:rgba(240,234,214,0.38);--border:rgba(201,168,76,0.18);--shadow-glow:0 0 0 1px rgba(201,168,76,0.18),0 8px 32px rgba(201,168,76,0.1);--bg-img-filter:brightness(0.13) saturate(0.35);}
    [data-theme="light"]{--bg-page:#F5F0E8;--bg-card:rgba(255,255,255,0.85);--bg-card-hover:rgba(201,168,76,0.06);--bg-nav:rgba(245,240,232,0.92);--text-primary:#1A1209;--text-secondary:#5C4A28;--text-muted:#9C8A5A;--border:rgba(201,168,76,0.28);--shadow-glow:0 0 0 1px rgba(201,168,76,0.3),0 4px 20px rgba(201,168,76,0.12);--bg-img-filter:brightness(0.6) saturate(0.25) opacity(0.18);}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;font-family:'Cairo',sans-serif;background:var(--bg-page);color:var(--text-primary);direction:rtl;overflow-x:hidden;transition:background var(--transition),color var(--transition);}
    .bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
    .bg-img{position:absolute;inset:0;background:url('photo_2025-06-09_17-02-57.jpg') center/cover no-repeat;filter:var(--bg-img-filter);transition:filter var(--transition);}
    [data-theme="dark"] .bg-overlay{position:absolute;inset:0;background:radial-gradient(ellipse 120% 55% at 50% -5%,rgba(201,168,76,0.13) 0%,transparent 58%),linear-gradient(180deg,rgba(7,12,22,0.25) 0%,rgba(7,12,22,0.96) 100%);}
    [data-theme="light"] .bg-overlay{position:absolute;inset:0;background:radial-gradient(ellipse 120% 55% at 50% -5%,rgba(201,168,76,0.07) 0%,transparent 58%),linear-gradient(180deg,rgba(245,240,232,0.55) 0%,rgba(245,240,232,0.97) 100%);}
    .bg-dots{position:absolute;inset:0;background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:40px 40px;}
    .wrapper{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 1rem 4rem;}
    .top-nav{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0.85rem 0.6rem;border-bottom:1px solid var(--border);background:var(--bg-nav);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);position:sticky;top:0;z-index:100;transition:background var(--transition);}
    .back-link{display:inline-flex;align-items:center;gap:0.4rem;color:var(--gold);text-decoration:none;font-size:0.88rem;font-weight:700;padding:0.4rem 1rem;border:1px solid var(--border);border-radius:50px;background:var(--gold-subtle);}
    .back-link:active{background:rgba(201,168,76,0.18);}
    .nav-title{font-family:'Amiri',serif;font-size:1rem;color:var(--gold-light);}
    .nav-actions{display:flex;align-items:center;}
    #themeToggleBtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--gold-subtle);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:background var(--transition);-webkit-tap-highlight-color:transparent;}
    #themeToggleBtn:hover{background:rgba(201,168,76,0.16);}
    .page-header{text-align:center;padding:2.5rem 1rem 2rem;animation:fadeDown 0.7s ease both;}
    .cross-icon{font-size:2rem;color:var(--gold);display:block;margin-bottom:0.5rem;text-shadow:0 0 28px var(--gold-glow);}
    .page-header h1{font-family:'Amiri',serif;font-size:clamp(1.6rem,5vw,2.3rem);font-weight:700;color:var(--text-primary);}
    .page-header p{font-size:0.9rem;color:var(--text-secondary);margin-top:0.5rem;}
    .gold-line{width:64px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0.9rem auto 0;border-radius:2px;}
    .cards-grid{width:100%;max-width:640px;display:grid;grid-template-columns:1fr 1fr;gap:1rem;animation:fadeUp 0.85s ease 0.15s both;}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.6rem 0.9rem 1.3rem;text-align:center;text-decoration:none;color:var(--text-primary);transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition),background var(--transition);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;gap:0.7rem;position:relative;overflow:hidden;}
    .card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(201,168,76,0.07) 0%,transparent 70%);pointer-events:none;}
    .card:active{transform:scale(0.97);}
    @media(hover:hover){.card:hover{transform:translateY(-4px);border-color:var(--gold-border-strong);box-shadow:var(--shadow-glow);background:var(--bg-card-hover);}}
    .card-icon{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,rgba(201,168,76,0.22),rgba(201,168,76,0.05));border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--gold);}
    .card-title{font-family:'Amiri',serif;font-size:1.05rem;font-weight:700;line-height:1.4;color:var(--text-primary);}
    .card-btn{font-size:0.78rem;color:var(--gold);padding:0.3rem 0.9rem;border:1px solid var(--gold-border);border-radius:50px;background:var(--gold-subtle);white-space:nowrap;}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:360px){.cards-grid{grid-template-columns:1fr;max-width:300px;}.card{flex-direction:row;padding:1rem;text-align:right;}.card-icon{flex-shrink:0;}}
  </style>
</head>
<body>
  <div class="bg"><div class="bg-img"></div><div class="bg-overlay"></div><div class="bg-dots"></div></div>
  <div class="wrapper">
    <nav class="top-nav">
      <a class="back-link" href="index.html"><i class="ti ti-arrow-right"></i> رجوع</a>
      <span class="nav-title">✙ مارجرجس</span>
      <div class="nav-actions">
        <button id="themeToggleBtn" onclick="window.__mgTheme.toggle()" aria-label="تبديل الوضع"><i class="ti ti-moon"></i></button>
      </div>
    </nav>
    <header class="page-header">
      <span class="cross-icon">✙</span>
      <h1>اختر الخورس</h1>
      <p>مهرجان الكرزاة المرقسية</p>
      <div class="gold-line"></div>
    </header>
    <div class="cards-grid">
      <a class="card" href="mohoob1.html"><div class="card-icon"><i class="ti ti-baby-carriage"></i></div><div class="card-title">حضانة موهوبين</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="hadana.html"><div class="card-icon"><i class="ti ti-music"></i></div><div class="card-title">حضانة مستوى أول</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="melodies_mohoob.html"><div class="card-icon"><i class="ti ti-music-note"></i></div><div class="card-title">أولى وثانية موهوبين</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="melodies_level1.html"><div class="card-icon"><i class="ti ti-microphone"></i></div><div class="card-title">أولى وثانية مستوى أول</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="mohoob3.html"><div class="card-icon"><i class="ti ti-piano"></i></div><div class="card-title">ثالثة ورابعة موهوبين</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="mohoob.html"><div class="card-icon"><i class="ti ti-vinyl"></i></div><div class="card-title">خامسة وسادسة موهوبين</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="level1-5&6.html"><div class="card-icon"><i class="ti ti-bell"></i></div><div class="card-title">خامسة وسادسة مستوى ثانى</div><span class="card-btn">عرض الألحان</span></a>
    </div>
  </div>
  <script>
    (function(){const KEY='mgTheme';const root=document.documentElement;function applyTheme(t){root.setAttribute('data-theme',t);localStorage.setItem(KEY,t);const btn=document.getElementById('themeToggleBtn');if(btn){btn.querySelector('.ti').className=t==='dark'?'ti ti-sun':'ti ti-moon';}}function toggle(){applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');}const saved=localStorage.getItem(KEY);const preferred=saved||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');applyTheme(preferred);window.__mgTheme={toggle,applyTheme};})();
  </script>
</body>
</html>
