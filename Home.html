<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>اختر الخورس</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-glow: rgba(201,168,76,0.3);
      --deep: #090F1A;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(201,168,76,0.2);
      --text: #F0EAD6;
      --text-dim: rgba(240,234,214,0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; font-family: 'Cairo', sans-serif; background: var(--deep); color: var(--text); direction: rtl; overflow-x: hidden; }

    .bg { position: fixed; inset: 0; z-index: 0; }
    .bg-img { position: absolute; inset: 0; background: url('photo_2025-06-09_17-02-57.jpg') center/cover no-repeat; filter: brightness(0.18) saturate(0.5); }
    .bg-overlay { position: absolute; inset: 0; background: radial-gradient(ellipse 100% 50% at 50% -10%, rgba(201,168,76,0.18) 0%, transparent 60%), linear-gradient(180deg, rgba(9,15,26,0.3) 0%, rgba(9,15,26,0.95) 100%); }
    .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(201,168,76,0.05) 1px, transparent 1px); background-size: 36px 36px; }

    .wrapper { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 1rem 3rem; }

    /* TOP NAV */
    .top-nav {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 0.5rem;
      border-bottom: 1px solid rgba(201,168,76,0.1);
      margin-bottom: 0.5rem;
      animation: fadeDown 0.7s ease both;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      color: var(--gold); text-decoration: none; font-size: 0.9rem; font-weight: 600;
      padding: 0.4rem 0.9rem;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 50px;
      background: rgba(201,168,76,0.06);
      transition: all 0.25s;
    }
    .back-link:active { background: rgba(201,168,76,0.15); }
    .nav-title { font-family: 'Amiri', serif; font-size: 1rem; color: var(--gold-light); }

    /* HEADER */
    .page-header { text-align: center; padding: 1.5rem 1rem 2rem; animation: fadeDown 0.8s ease 0.1s both; }
    .cross-icon { font-size: 1.8rem; color: var(--gold); display: block; margin-bottom: 0.5rem; text-shadow: 0 0 20px var(--gold-glow); }
    .page-header h1 { font-family: 'Amiri', serif; font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 700; }
    .gold-line { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0.8rem auto 0; border-radius: 2px; }

    /* GRID */
    .cards-grid { width: 100%; max-width: 640px; display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; animation: fadeUp 0.9s ease 0.2s both; }

    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 18px; padding: 1.5rem 0.8rem;
      text-align: center; text-decoration: none; color: var(--text);
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
    }
    .card:active { transform: scale(0.97); }
    @media (hover: hover) {
      .card:hover { transform: translateY(-4px); border-color: var(--gold); box-shadow: 0 10px 35px rgba(201,168,76,0.15); background: rgba(201,168,76,0.07); }
    }

    .card-icon { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.04)); border: 1px solid rgba(201,168,76,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .card-title { font-family: 'Amiri', serif; font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
    .card-btn { font-size: 0.78rem; color: var(--gold); padding: 0.3rem 0.9rem; border: 1px solid rgba(201,168,76,0.35); border-radius: 50px; background: rgba(201,168,76,0.07); white-space: nowrap; }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(18px);  } to { opacity:1; transform:translateY(0); } }

    @media (max-width: 360px) {
      .cards-grid { grid-template-columns: 1fr; max-width: 300px; }
      .card { flex-direction: row; padding: 1rem 1rem; text-align: right; }
      .card-icon { flex-shrink: 0; }
    }
  </style>
</head>
<body>
  <div class="bg"><div class="bg-img"></div><div class="bg-overlay"></div><div class="bg-dots"></div></div>
  <div class="wrapper">

    <nav class="top-nav">
      <a class="back-link" href="index.html">&#x2039; رجوع</a>
      <span class="nav-title">✙ مارجرجس</span>
    </nav>

    <header class="page-header">
      <span class="cross-icon">✙</span>
      <h1>اختر الخورس</h1>
      <div class="gold-line"></div>
    </header>

    <div class="cards-grid">
      <a class="card" href="mohoob1.html"><div class="card-icon">🎼</div><div class="card-title">حضانة موهوبين</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="hadana.html"><div class="card-icon">🎵</div><div class="card-title">حضانة مستوى أول</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="melodies_mohoob.html"><div class="card-icon">🎶</div><div class="card-title">أولى وثانية موهوبين</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="melodies_level1.html"><div class="card-icon">🎤</div><div class="card-title">أولى وثانية مستوى أول</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="mohoob3.html"><div class="card-icon">🎹</div><div class="card-title">ثالثة ورابعة موهوبين</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="mohoob.html"><div class="card-icon">🎻</div><div class="card-title">خامسة وسادسة موهوبين</div><span class="card-btn">عرض الألحان</span></a>
      <a class="card" href="level1-5&6.html"><div class="card-icon">🔔</div><div class="card-title">خامسة وسادسة مستوى ثانى</div><span class="card-btn">عرض الألحان</span></a>
    </div>
  </div>
</body>
</html>
